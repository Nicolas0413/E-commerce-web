<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto - Kablau</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="navbar">
    <a href="index.html"><img id="logo" src="Img/kablau.png" alt="logo da loja kablau"></a>
    <a href="index.html" class="btn_comprar">Voltar para loja</a>
</div>

<div class="produto_page">

    <div class="produto_imagem">
        <img id="imagem_produto" src="" alt="">
    </div>

    <div class="produto_compra">

        <h2 id="nome_produto"></h2>

        <p id="preco_avista" class="preco_avista"></p>
        <p id="preco_parcelado" class="preco_parcelado"></p>

        <p class="prazo">Entrega em até 5 dias úteis</p>
        <span>
            <label>Quantidade:</label>
            <input type="number" value="1" min="1" id="quantidade" class="quantidade">
        </span>

        <p id="valor_parcial" class="valor_parcial"></p>

        <button type="button" id="btn_adicionar_carrinho" class="btn_comprar">Adicionar ao carrinho</button>
        <p id="mensagem_carrinho" class="mensagem_status"></p>

        <h3>Formas de pagamento</h3>
        <ul class="pagamentos">
            <li>Cartão de Crédito (Visa / Mastercard)</li>
            <li>Cartão de Débito</li>
            <li>PIX</li>
            <li>Boleto Bancário</li>
        </ul>

    </div>

</div>

<div class="produto_detalhes">

    <h3>Características do Produto:</h3>

    <ul id="lista_caracteristicas" class="caracteristicas">
    </ul>

    <h3>Descrição:</h3>

    <p id="descricao_produto">
    </p>

</div>

<div class="avaliacoes">

    <h3>Avaliações dos usuários:</h3>

    <div id="lista_avaliacoes">
    </div>

</div>

<script src="produtos.js"></script>
<script src="carrinho-utils.js"></script>
<script src="produto.js"></script>
</body>
</html>
