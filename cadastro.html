<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Kablau</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="navbar">
        <a href="index.html"><img id="logo" src="Img/kablau.png" alt="logo da loja kablau"></a>
        <a href="index.html" class="btn_comprar">Voltar para a loja</a>
    </div>

    <div id="cadastro" class="login_container">

        <form class="login_card">

            <h2>Cadastre-se na Kablau</h2>

            <div id="alerta_cadastro" class="alerta"></div>

            <label>Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo">

            <label>Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu login">

            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" minlength="4">

            <label>CPF</label>
            <input type="text" id="cpf" placeholder="Digite seu cpf (apenas números)" maxlength="11">

            <label>Data de nascimento</label>
            <input type="date" id="nascimento">

            <label>Email</label>
            <input type="email" id="email" placeholder="Digite seu email">

            <button type="submit" class="btn_comprar">
                Cadastrar  
            </button>

            <span>Já está cadastrado? <a href="login.html">Fazer login</a></span>
        </form>

    </div>

    <script src="cadastro.js"></script>
</body>
</html>
